name: Release browser extension

# Builds the MV3 browser extension and publishes a ready-to-load zip.
# - Push a tag like `browser-extension-v0.1.0` → creates a GitHub Release with the zip attached.
# - Manual run (workflow_dispatch) → builds and uploads the zip as a run artifact (no Release).
on:
  push:
    tags: ["browser-extension-v*"]
  workflow_dispatch:

# Default the workflow token to read-only; the release job elevates to write.
permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create releases / upload assets
    steps:
      # Third-party actions pinned to a full commit SHA (supply-chain safety); the
      # trailing comment records the human-readable version.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.10.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Workspace deps FIRST: the extension's typecheck/tests resolve @libre/listener-wallet
      # types from its dist/, which doesn't exist on a fresh checkout (same order as ci.yml —
      # gates before build fail with TS2307 "Cannot find module").
      - name: Build workspace deps
        run: pnpm build # turbo: shared → SDK → …

      # Never ship an unverified extension zip: gate on lint, storage contract,
      # typecheck, and the extension unit tests before building the release.
      - name: Lint
        run: pnpm --filter @libre/browser-extension lint
      - name: Storage-contract guard
        run: pnpm check:storage
      - name: Typecheck
        run: pnpm --filter @libre/browser-extension typecheck
      - name: Unit tests
        run: pnpm --filter @libre/browser-extension test

      - name: Build extension
        run: pnpm --filter @libre/browser-extension build # → packages/browser-extension/dist

      # The tag is the single source of truth for the release version: browser-extension-vX.Y.Z
      # stamps "version": "X.Y.Z" into the built manifest, so cutting a release is exactly one
      # action (push the tag) and the shipped version can never drift from it. Manual-dispatch
      # builds keep the source manifest's version.
      - name: Stamp manifest version from tag (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#browser-extension-v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag $GITHUB_REF_NAME must end in a semver version (browser-extension-vX.Y.Z)"; exit 1
          fi
          MANIFEST=packages/browser-extension/dist/manifest.json
          jq --arg v "$VERSION" '.version = $v' "$MANIFEST" > /tmp/manifest.json
          mv /tmp/manifest.json "$MANIFEST"
          echo "Stamped manifest version $VERSION"

      - name: Package unpacked extension
        run: |
          mkdir -p out/libre-listener-wallet-extension
          cp -r packages/browser-extension/dist/* out/libre-listener-wallet-extension/
          (cd out && zip -r ../libre-listener-wallet-extension.zip libre-listener-wallet-extension)

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: libre-listener-wallet-extension
          path: libre-listener-wallet-extension.zip

      - name: Create GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" libre-listener-wallet-extension.zip \
            --title "Browser extension $GITHUB_REF_NAME" \
            --notes "Unpacked MV3 build of the Libre Listener Wallet extension (Chrome / Brave).

          **Install:** download \`libre-listener-wallet-extension.zip\`, unzip it, open \`chrome://extensions\`, turn on **Developer mode**, click **Load unpacked**, and select the unzipped \`libre-listener-wallet-extension\` folder. Full steps in packages/browser-extension/README.md.

          > Experimental — not production-ready. Loss of funds is possible."
